<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="260" viewBox="0 0 1200 260" role="img" aria-labelledby="title desc">
  <title id="title">Gabriel Azevedo — animated ASCII signature</title>
  <desc id="desc">Blue and silver terminal-inspired ASCII banner for Gabriel Azevedo.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#080c12"/>
      <stop offset="0.55" stop-color="#0d1117"/>
      <stop offset="1" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="blue" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2f81f7"/>
      <stop offset="0.5" stop-color="#58a6ff"/>
      <stop offset="1" stop-color="#79c0ff"/>
    </linearGradient>
    <linearGradient id="silver" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8b949e"/>
      <stop offset="0.48" stop-color="#f0f6fc"/>
      <stop offset="1" stop-color="#8b949e"/>
    </linearGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1200" height="260" rx="22" fill="url(#bg)"/>
  <rect x="1" y="1" width="1198" height="258" rx="21" fill="none" stroke="#30363d" stroke-width="2"/>
  <circle cx="25" cy="23" r="6" fill="#ff5f56"/><circle cx="46" cy="23" r="6" fill="#ffbd2e"/><circle cx="67" cy="23" r="6" fill="#27c93f"/>
  <text x="600" y="28" text-anchor="middle" fill="#6e7681" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13">gabriel@system / identity</text>

  <g fill="url(#blue)" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-weight="900" font-size="21" filter="url(#glow)">
    <text x="90" y="78"> ██████╗  █████╗ ██████╗ ██████╗ ██╗███████╗██╗</text>
    <text x="90" y="102">██╔════╝ ██╔══██╗██╔══██╗██╔══██╗██║██╔════╝██║</text>
    <text x="90" y="126">██║  ███╗███████║██████╔╝██████╔╝██║█████╗  ██║</text>
    <text x="90" y="150">██║   ██║██╔══██║██╔══██╗██╔══██╗██║██╔══╝  ██║</text>
    <text x="90" y="174">╚██████╔╝██║  ██║██████╔╝██║  ██║██║███████╗███████╗</text>
    <text x="90" y="198"> ╚═════╝ ╚═╝  ╚═╝╚═════╝ ╚═╝  ╚═╝╚═╝╚══════╝╚══════╝</text>
  </g>

  <rect x="82" y="211" width="930" height="1" fill="#30363d"/>
  <text x="90" y="237" fill="url(#silver)" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" letter-spacing="2">FULL STACK  //  AI SYSTEMS  //  LOCAL-FIRST  //  AUTOMATION</text>
  <text x="1034" y="237" fill="#58a6ff" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14">_</text>
  <animate xlink:href="#cursor" attributeName="opacity" values="1;0;1" dur="0.9s" repeatCount="indefinite"/>

  <rect id="scan" x="0" y="44" width="1200" height="2" fill="#79c0ff" opacity="0.08">
    <animate attributeName="y" values="44;246;44" dur="6s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.03;0.13;0.03" dur="6s" repeatCount="indefinite"/>
  </rect>

  <rect id="cursor" x="1034" y="224" width="9" height="16" rx="1" fill="#58a6ff">
    <animate attributeName="opacity" values="1;0;1" dur="0.9s" repeatCount="indefinite"/>
  </rect>
</svg>
