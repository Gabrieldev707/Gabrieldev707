<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="260" viewBox="0 0 1200 260" role="img" aria-labelledby="title desc">
  <title id="title">Animated starfield header</title>
  <desc id="desc">Deep blue night sky with twinkling stars and a shooting star.</desc>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#050914"/>
      <stop offset="52%" stop-color="#081426"/>
      <stop offset="100%" stop-color="#0b1d38"/>
    </linearGradient>
    <radialGradient id="nebula" cx="78%" cy="62%" r="48%">
      <stop offset="0%" stop-color="#1f6feb" stop-opacity=".24"/>
      <stop offset="45%" stop-color="#58a6ff" stop-opacity=".08"/>
      <stop offset="100%" stop-color="#58a6ff" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="2.6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <linearGradient id="meteor" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#9ecbff" stop-opacity="0"/>
      <stop offset="70%" stop-color="#c9e2ff" stop-opacity=".55"/>
      <stop offset="100%" stop-color="#ffffff"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="260" fill="url(#sky)"/>
  <rect width="1200" height="260" fill="url(#nebula)"/>

  <g fill="#ffffff">
    <circle cx="54" cy="44" r="1.2"><animate attributeName="opacity" values=".25;1;.25" dur="3.8s" repeatCount="indefinite"/></circle>
    <circle cx="112" cy="112" r="1.5"><animate attributeName="opacity" values=".2;.9;.2" dur="5.1s" begin=".7s" repeatCount="indefinite"/></circle>
    <circle cx="183" cy="66" r=".9"><animate attributeName="opacity" values=".35;1;.35" dur="4.4s" begin="1.3s" repeatCount="indefinite"/></circle>
    <circle cx="244" cy="29" r="1.3"><animate attributeName="opacity" values=".2;.85;.2" dur="3.2s" begin=".4s" repeatCount="indefinite"/></circle>
    <circle cx="321" cy="139" r="1.1"><animate attributeName="opacity" values=".3;1;.3" dur="4.9s" begin="2.2s" repeatCount="indefinite"/></circle>
    <circle cx="387" cy="82" r="1.7" filter="url(#glow)"><animate attributeName="opacity" values=".3;1;.3" dur="3.7s" repeatCount="indefinite"/></circle>
    <circle cx="468" cy="43" r=".9"><animate attributeName="opacity" values=".35;.95;.35" dur="5.5s" begin="1.1s" repeatCount="indefinite"/></circle>
    <circle cx="530" cy="161" r="1.2"><animate attributeName="opacity" values=".2;1;.2" dur="4.1s" begin="2.8s" repeatCount="indefinite"/></circle>
    <circle cx="606" cy="98" r="1.4"><animate attributeName="opacity" values=".3;.9;.3" dur="3.5s" begin="1.7s" repeatCount="indefinite"/></circle>
    <circle cx="676" cy="37" r="1.1"><animate attributeName="opacity" values=".15;.95;.15" dur="4.8s" begin=".9s" repeatCount="indefinite"/></circle>
    <circle cx="742" cy="132" r="1.6" filter="url(#glow)"><animate attributeName="opacity" values=".25;1;.25" dur="3.1s" begin="2.4s" repeatCount="indefinite"/></circle>
    <circle cx="812" cy="72" r=".9"><animate attributeName="opacity" values=".3;.85;.3" dur="5.3s" begin="1.6s" repeatCount="indefinite"/></circle>
    <circle cx="884" cy="41" r="1.2"><animate attributeName="opacity" values=".25;1;.25" dur="4.2s" begin="2.1s" repeatCount="indefinite"/></circle>
    <circle cx="946" cy="156" r="1.1"><animate attributeName="opacity" values=".2;.9;.2" dur="3.9s" begin=".8s" repeatCount="indefinite"/></circle>
    <circle cx="1018" cy="89" r="1.7" filter="url(#glow)"><animate attributeName="opacity" values=".3;1;.3" dur="5s" begin="1.4s" repeatCount="indefinite"/></circle>
    <circle cx="1084" cy="33" r="1.0"><animate attributeName="opacity" values=".25;.9;.25" dur="4.6s" begin="2.6s" repeatCount="indefinite"/></circle>
    <circle cx="1150" cy="142" r="1.3"><animate attributeName="opacity" values=".25;1;.25" dur="3.3s" begin=".5s" repeatCount="indefinite"/></circle>
  </g>

  <g fill="#79c0ff" opacity=".82">
    <circle cx="74" cy="190" r=".8"/><circle cx="154" cy="220" r="1"/><circle cx="270" cy="198" r=".8"/>
    <circle cx="420" cy="215" r="1"/><circle cx="566" cy="226" r=".9"/><circle cx="688" cy="202" r=".9"/>
    <circle cx="836" cy="218" r="1"/><circle cx="972" cy="204" r=".8"/><circle cx="1124" cy="221" r="1"/>
  </g>

  <g filter="url(#glow)" opacity="0">
    <line x1="-110" y1="20" x2="10" y2="20" stroke="url(#meteor)" stroke-width="2.2" stroke-linecap="round"/>
    <circle cx="10" cy="20" r="2.4" fill="#fff"/>
    <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;.14;.18;.42;.48;1" dur="9s" repeatCount="indefinite"/>
    <animateTransform attributeName="transform" type="translate" values="280 8;280 8;880 95;880 95" keyTimes="0;.14;.48;1" dur="9s" repeatCount="indefinite"/>
  </g>

  <path d="M0 226 C180 210 340 248 520 229 C710 207 870 243 1200 220 L1200 260 L0 260 Z" fill="#050914" opacity=".5"/>
</svg>