<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-labelledby="title desc">
  <title id="title">Almofadas under a starry night</title>
  <desc id="desc">Animated tuxedo cat blinking and moving its tail under twinkling stars.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#050914"/>
      <stop offset="72%" stop-color="#0a1830"/>
      <stop offset="100%" stop-color="#10284b"/>
    </linearGradient>
    <radialGradient id="haze" cx="60%" cy="82%" r="60%">
      <stop offset="0%" stop-color="#58a6ff" stop-opacity=".18"/>
      <stop offset="100%" stop-color="#58a6ff" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="2.3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1200" height="300" fill="url(#bg)"/>
  <rect width="1200" height="300" fill="url(#haze)"/>

  <g fill="#fff">
    <circle cx="70" cy="52" r="1.2"><animate attributeName="opacity" values=".2;1;.2" dur="4.3s" repeatCount="indefinite"/></circle>
    <circle cx="150" cy="104" r=".9"><animate attributeName="opacity" values=".3;.9;.3" dur="3.1s" begin=".8s" repeatCount="indefinite"/></circle>
    <circle cx="238" cy="39" r="1.4" filter="url(#glow)"><animate attributeName="opacity" values=".2;1;.2" dur="5.2s" begin="1.4s" repeatCount="indefinite"/></circle>
    <circle cx="344" cy="132" r="1"><animate attributeName="opacity" values=".25;.8;.25" dur="4.7s" begin=".5s" repeatCount="indefinite"/></circle>
    <circle cx="450" cy="74" r="1.1"><animate attributeName="opacity" values=".2;1;.2" dur="3.6s" begin="2.2s" repeatCount="indefinite"/></circle>
    <circle cx="575" cy="43" r="1.6" filter="url(#glow)"><animate attributeName="opacity" values=".3;1;.3" dur="4.4s" begin="1s" repeatCount="indefinite"/></circle>
    <circle cx="700" cy="116" r=".9"><animate attributeName="opacity" values=".3;.95;.3" dur="5.4s" begin="2.7s" repeatCount="indefinite"/></circle>
    <circle cx="815" cy="61" r="1.3"><animate attributeName="opacity" values=".25;1;.25" dur="3.7s" begin="1.8s" repeatCount="indefinite"/></circle>
    <circle cx="915" cy="126" r="1"><animate attributeName="opacity" values=".2;.85;.2" dur="4.9s" begin=".9s" repeatCount="indefinite"/></circle>
    <circle cx="1040" cy="51" r="1.5" filter="url(#glow)"><animate attributeName="opacity" values=".2;1;.2" dur="3.4s" begin="1.2s" repeatCount="indefinite"/></circle>
    <circle cx="1130" cy="92" r="1"><animate attributeName="opacity" values=".3;.9;.3" dur="4.5s" begin="2.4s" repeatCount="indefinite"/></circle>
  </g>

  <path d="M0 238 C180 222 330 260 510 240 C705 218 885 260 1200 230 L1200 300 L0 300 Z" fill="#050914"/>
  <path d="M0 252 C230 236 420 271 620 252 C835 231 1010 266 1200 245" fill="none" stroke="#163a68" stroke-opacity=".45" stroke-width="2"/>

  <!-- simple Almofadas tuxedo cat -->
  <g transform="translate(955 124)">
    <!-- tail -->
    <g transform="translate(118 109)">
      <path d="M0 0 C52 -8 70 18 56 38 C44 55 17 47 19 31 C21 20 36 19 45 26" fill="none" stroke="#151a26" stroke-width="22" stroke-linecap="round"/>
      <path d="M44 27 C54 32 57 38 54 43" fill="none" stroke="#eef4ff" stroke-width="9" stroke-linecap="round"/>
      <animateTransform attributeName="transform" additive="sum" type="rotate" values="0 0 0;8 0 0;-6 0 0;0 0 0" dur="4.6s" repeatCount="indefinite"/>
    </g>

    <!-- body -->
    <ellipse cx="76" cy="113" rx="63" ry="57" fill="#171c28"/>
    <ellipse cx="73" cy="121" rx="31" ry="40" fill="#f1f5fb"/>

    <!-- ears -->
    <path d="M27 42 L43 3 L60 39 Z" fill="#171c28"/>
    <path d="M91 38 L112 5 L119 47 Z" fill="#171c28"/>
    <path d="M36 34 L44 13 L53 35 Z" fill="#d77a86"/>
    <path d="M99 34 L109 16 L113 38 Z" fill="#d77a86"/>

    <!-- head -->
    <ellipse cx="73" cy="58" rx="49" ry="43" fill="#1a1f2c"/>
    <path d="M72 22 C62 39 59 47 58 59 C61 72 69 83 75 94 C86 78 91 68 91 56 C88 41 82 32 72 22 Z" fill="#f2f6fb" opacity=".98"/>
    <ellipse cx="60" cy="68" rx="25" ry="20" fill="#f2f6fb"/>
    <ellipse cx="87" cy="68" rx="25" ry="20" fill="#f2f6fb"/>

    <!-- eyes -->
    <g>
      <ellipse cx="57" cy="57" rx="7.4" ry="10.2" fill="#7ee787"/>
      <ellipse cx="89" cy="57" rx="7.4" ry="10.2" fill="#7ee787"/>
      <ellipse cx="57" cy="58" rx="3.5" ry="7.2" fill="#061019"/>
      <ellipse cx="89" cy="58" rx="3.5" ry="7.2" fill="#061019"/>
      <circle cx="54" cy="53" r="2" fill="#fff"/>
      <circle cx="86" cy="53" r="2" fill="#fff"/>
      <animate attributeName="opacity" values="1;1;0;1;1" keyTimes="0;.42;.45;.49;1" dur="5.8s" repeatCount="indefinite"/>
    </g>
    <g opacity="0">
      <path d="M49 59 Q57 64 65 59" fill="none" stroke="#0b1018" stroke-width="2.6" stroke-linecap="round"/>
      <path d="M81 59 Q89 64 97 59" fill="none" stroke="#0b1018" stroke-width="2.6" stroke-linecap="round"/>
      <animate attributeName="opacity" values="0;0;1;0;0" keyTimes="0;.42;.45;.49;1" dur="5.8s" repeatCount="indefinite"/>
    </g>

    <!-- nose + mouth -->
    <path d="M69 71 Q73 67 77 71 Q73 75 69 71" fill="#e89aa7"/>
    <path d="M73 74 Q67 80 62 76 M73 74 Q79 80 84 76" fill="none" stroke="#111722" stroke-width="2" stroke-linecap="round"/>

    <!-- paws -->
    <ellipse cx="47" cy="154" rx="24" ry="12" fill="#f2f6fb"/>
    <ellipse cx="98" cy="154" rx="24" ry="12" fill="#f2f6fb"/>
    <path d="M41 154 l0 5 M47 154 l0 6 M96 154 l0 6 M102 154 l0 5" stroke="#b9c6d8" stroke-width="1.3" stroke-linecap="round"/>

    <!-- whiskers -->
    <path d="M37 73 H4 M39 79 L7 87 M108 73 H141 M106 79 L138 87" stroke="#d9e6f5" stroke-width="1.4" stroke-linecap="round" opacity=".8"/>

    <!-- little sparkle -->
    <g transform="translate(148 40)" filter="url(#glow)">
      <path d="M0 -9 L3 -3 L9 0 L3 3 L0 9 L-3 3 L-9 0 L-3 -3 Z" fill="#79c0ff">
        <animateTransform attributeName="transform" type="scale" values=".55;1;.55" dur="2.6s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values=".35;1;.35" dur="2.6s" repeatCount="indefinite"/>
      </path>
    </g>
  </g>

  <text x="34" y="278" fill="#8b949e" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" opacity=".8">ship something worth remembering.</text>
</svg>