[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "swa"
version = "0.0.1"
description = "SWA — mundos de negócio brasileiros, stateful e verificáveis, para testar agentes via MCP."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "inspect_ai>=0.3.200",
    "mcp>=2.0",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.entry-points.inspect_ai]
swa = "swa._registry"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
