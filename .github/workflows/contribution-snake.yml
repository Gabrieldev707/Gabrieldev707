name: Generate contribution snake

on:
  schedule:
    - cron: "23 4 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Generate light and dark SVGs
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=#2F81F7&color_dots=#EBEDF0,#B6D5FF,#74AEFF,#3B82F6,#7C3AED
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark&color_snake=#8AB4FF&color_dots=#161B22,#0B1F3A,#123A66,#2F81F7,#7C3AED

      - name: Publish SVGs to the output branch
        uses: crazy-max/ghaction-github-pages@v5
        with:
          target_branch: output
          build_dir: dist
          commit_message: "chore: update contribution animation"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
